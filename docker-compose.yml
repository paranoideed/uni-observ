services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: uni-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    networks:
      - uni-net
    depends_on:
      - tempo
      - prometheus
      - loki

  tempo:
    image: grafana/tempo:latest
    container_name: uni-tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    networks:
      - uni-net

  prometheus:
    image: prom/prometheus:latest
    container_name: uni-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - uni-net

  loki:
    image: grafana/loki:latest
    container_name: uni-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - uni-net

  promtail:
    image: grafana/promtail:latest
    container_name: uni-promtail
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - uni-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: uni-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - uni-net
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  tempodata:
  prometheusdata:
  grafanadata:
  lokidata:

networks:
  uni-net:
    name: uni-net
    external: true
